name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.7.17)"
        required: true
        type: string
      version_code:
        description: "Increasing Android version code (e.g. 28)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hongguo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Verify signing secrets exist
        env:
          KS: ${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.HG_RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.HG_RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.HG_RELEASE_KEY_PASSWORD }}
        run: |
          for var in KS SP KA KP; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing release signing secret: $var"
              exit 1
            fi
          done
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build signed Release APK
        env:
          HG_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          HG_RELEASE_STORE_PASSWORD: ${{ secrets.HG_RELEASE_STORE_PASSWORD }}
          HG_RELEASE_KEY_ALIAS: ${{ secrets.HG_RELEASE_KEY_ALIAS }}
          HG_RELEASE_KEY_PASSWORD: ${{ secrets.HG_RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          case "$VERSION_NAME" in *[!0-9A-Za-z._-]*|'') echo "Invalid version name"; exit 1;; esac
          case "$VERSION_CODE" in *[!0-9]*|'') echo "Invalid version code"; exit 1;; esac
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease "-PappVersionName=$VERSION_NAME" "-PappVersionCode=$VERSION_CODE"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/Hongguo-v${VERSION_NAME}-release.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Increase version."
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Hongguo $TAG" --generate-notes
