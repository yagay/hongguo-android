name: Native rewrite Android build
# Release builds also run on rewrite commits explicitly marked [release].
on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]
  workflow_call:
    inputs:
      signed_release:
        description: 'Build signed Release APK'
        required: false
        default: false
        type: boolean
    secrets:
      HG_RELEASE_KEYSTORE_BASE64:
        required: true
      HG_RELEASE_STORE_PASSWORD:
        required: true
      HG_RELEASE_KEY_ALIAS:
        required: true
      HG_RELEASE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Release APK using GitHub Actions secrets'
        required: false
        default: false
        type: boolean
concurrency:
  group: native-rewrite-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.signed_release) && 'release' || 'debug' }}
  cancel-in-progress: false
jobs:
  debug:
    if: ${{ !inputs.signed_release && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install NDK r28c for 16 KiB native libraries
        run: sdkmanager --install "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: |
            app/libs/openhongguo-16kb-recovery.aar
            app/libs/openhongguo-16kb-recovery.aar.buildstamp
          key: ${{ runner.os }}-official-openhongguo-v0.4.0-ndk28c-go126-arm64-16k-v3-current-v5-video-tab
      - name: Build or restore official 16 KiB OpenHongguo SDK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-openhongguo-16kb.sh
      - name: Build Debug APK
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug --build-cache --no-daemon 2>&1 | tee debug-build.log
      - name: Verify ALL packaged ARM64 ELF are 16 KiB aligned
        run: |
          python3 scripts/verify-16kb-elf.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-rewrite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9

      - name: Run Debug unit tests
        id: tests
        run: |
          set -o pipefail
          bash ./gradlew :app:testDebugUnitTest --build-cache --no-daemon 2>&1 | tee debug-tests.log

      - name: Lint diagnostic (does not block Debug APK)
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./gradlew :app:lintDebug --build-cache --no-daemon 2>&1 | tee lint-debug.log

      - name: Add build diagnostics to summary
        if: always()
        run: |
          {
            echo '## Debug validation'
            echo "Build and tests: ${{ job.status }}"
            echo "Tests: ${{ steps.tests.outcome }}"
            echo "Lint: ${{ steps.lint.outcome }}"
            if [ -f debug-build.log ]; then
              echo '### Compiler and test errors'
              echo '~~~'
              grep -E '(^e: |^error: |^\* What went wrong:|^> Task .* FAILED|^FAILURE:|^.*\.kt:[0-9]+:[0-9]+:)' debug-build.log | tail -n 70 || true
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-debug-failure-logs
          path: |
            debug-build.log
            lint-debug.log
            debug-tests.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          compression-level: 6

  # Only runs when explicitly selected via "Run workflow". Ordinary pushes
  # remain Debug-only. The signing key must live in repository Actions Secrets.
  release:
    if: ${{ inputs.signed_release || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Install NDK r28c for 16 KiB native libraries
        run: sdkmanager --install "ndk;28.2.13676358"
      - uses: actions/cache@v4
        with:
          path: |
            app/libs/openhongguo-16kb-recovery.aar
            app/libs/openhongguo-16kb-recovery.aar.buildstamp
          key: ${{ runner.os }}-official-openhongguo-v0.4.0-ndk28c-go126-arm64-16k-v3-current-v5-video-tab
      - name: Build or restore official 16 KiB OpenHongguo SDK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/build-openhongguo-16kb.sh

      - name: Decode private signing key
        shell: bash
        env:
          HG_RELEASE_KEYSTORE_BASE64: ${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HG_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing Actions secret: HG_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$HG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hongguo-release.p12"
          chmod 600 "$RUNNER_TEMP/hongguo-release.p12"
          echo "HG_RELEASE_STORE_FILE=$RUNNER_TEMP/hongguo-release.p12" >> "$GITHUB_ENV"

      - name: Run tests and build signed Release APK
        shell: bash
        env:
          HG_RELEASE_STORE_PASSWORD: ${{ secrets.HG_RELEASE_STORE_PASSWORD }}
          HG_RELEASE_KEY_ALIAS: ${{ secrets.HG_RELEASE_KEY_ALIAS }}
          HG_RELEASE_KEY_PASSWORD: ${{ secrets.HG_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest :app:assembleRelease --build-cache --no-daemon

      - name: Verify signed Release 16 KiB ELF and APK ZIP alignment
        run: |
          python3 scripts/verify-16kb-elf.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
      - name: Verify signature, signing identity and package name
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2); exit}')"
          expected="3586fd60c0243bb205f127b347e8eed7311f32d3ba146de97130229c8c220975"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release certificate fingerprint differs from the protected signing key" >&2
            exit 1
          fi
          package="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
          if [[ "$package" != "com.yagay.hongguo" ]]; then
            echo "Unexpected package name: $package" >&2
            exit 1
          fi
          cp "$apk" "app/build/outputs/apk/release/hongguo-release-signed.apk"
          sha256sum "app/build/outputs/apk/release/hongguo-release-signed.apk"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-signed-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/hongguo-release-signed.apk
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hongguo-release.p12"
