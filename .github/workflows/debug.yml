name: Native rewrite debug
on:
  push:
    branches: [rewrite-web-native]
  pull_request:
    branches: [rewrite-web-native]
  workflow_dispatch:
concurrency:
  group: native-rewrite-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build Debug APK and unit tests
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --build-cache --no-daemon 2>&1 | tee debug-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-rewrite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9

      - name: Lint diagnostic (does not block Debug APK)
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./gradlew :app:lintDebug --build-cache --no-daemon 2>&1 | tee lint-debug.log

      - name: Add build diagnostics to summary
        if: always()
        run: |
          {
            echo '## Debug validation'
            echo "Build and tests: ${{ job.status }}"
            echo "Lint: ${{ steps.lint.outcome }}"
            if [ -f debug-build.log ]; then
              echo '### Compiler and test errors'
              echo '~~~'
              grep -E '(^e: |^error: |^\* What went wrong:|^> Task .* FAILED|^FAILURE:|^.*\.kt:[0-9]+:[0-9]+:)' debug-build.log | tail -n 70 || true
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-debug-failure-logs
          path: |
            debug-build.log
            lint-debug.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          compression-level: 6
