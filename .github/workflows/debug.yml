name: Native rewrite Android build
on:
  push:
    branches: [rewrite-web-native]
  pull_request:
    branches: [rewrite-web-native]
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed Release APK using GitHub Actions secrets'
        required: false
        default: false
        type: boolean
concurrency:
  group: native-rewrite-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.signed_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build Debug APK
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug --build-cache --no-daemon 2>&1 | tee debug-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-rewrite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9

      - name: Run Debug unit tests
        id: tests
        run: |
          set -o pipefail
          bash ./gradlew :app:testDebugUnitTest --build-cache --no-daemon 2>&1 | tee debug-tests.log

      - name: Lint diagnostic (does not block Debug APK)
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./gradlew :app:lintDebug --build-cache --no-daemon 2>&1 | tee lint-debug.log

      - name: Add build diagnostics to summary
        if: always()
        run: |
          {
            echo '## Debug validation'
            echo "Build and tests: ${{ job.status }}"
            echo "Tests: ${{ steps.tests.outcome }}"
            echo "Lint: ${{ steps.lint.outcome }}"
            if [ -f debug-build.log ]; then
              echo '### Compiler and test errors'
              echo '~~~'
              grep -E '(^e: |^error: |^\* What went wrong:|^> Task .* FAILED|^FAILURE:|^.*\.kt:[0-9]+:[0-9]+:)' debug-build.log | tail -n 70 || true
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-debug-failure-logs
          path: |
            debug-build.log
            lint-debug.log
            debug-tests.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          compression-level: 6

  # Only runs when explicitly selected via "Run workflow". Ordinary pushes
  # remain Debug-only. The signing key must live in repository Actions Secrets.
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Decode private signing key
        shell: bash
        env:
          HG_RELEASE_KEYSTORE_BASE64: ${{ secrets.HG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${HG_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing Actions secret: HG_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$HG_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hongguo-release.p12"
          chmod 600 "$RUNNER_TEMP/hongguo-release.p12"
          echo "HG_RELEASE_STORE_FILE=$RUNNER_TEMP/hongguo-release.p12" >> "$GITHUB_ENV"

      - name: Run tests and build signed Release APK
        shell: bash
        env:
          HG_RELEASE_STORE_PASSWORD: ${{ secrets.HG_RELEASE_STORE_PASSWORD }}
          HG_RELEASE_KEY_ALIAS: ${{ secrets.HG_RELEASE_KEY_ALIAS }}
          HG_RELEASE_KEY_PASSWORD: ${{ secrets.HG_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew :app:testDebugUnitTest :app:assembleRelease --build-cache --no-daemon

      - name: Verify signature, signing identity and package name
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest/{print tolower($2); exit}')"
          expected="6bda27910d85360fd9304d32eecbaca624da8b4f617fefb308595eca1bbc68cf"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release certificate fingerprint differs from the protected signing key" >&2
            exit 1
          fi
          package="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" |
            sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n1)"
          if [[ "$package" != "com.yagay.hongguo" ]]; then
            echo "Unexpected package name: $package" >&2
            exit 1
          fi
          cp "$apk" "app/build/outputs/apk/release/hongguo-release-signed.apk"
          sha256sum "app/build/outputs/apk/release/hongguo-release-signed.apk"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-signed-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/hongguo-release-signed.apk
          if-no-files-found: error
          compression-level: 0

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/hongguo-release.p12"
