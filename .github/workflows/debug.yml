name: Native rewrite debug
on:
  push:
    branches: [rewrite-web-native]
  pull_request:
    branches: [rewrite-web-native]
  workflow_dispatch:
concurrency:
  group: native-rewrite-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build Debug APK
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --build-cache --no-daemon 2>&1 | tee debug-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-rewrite-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 9

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-native-debug-failure-logs
          path: |
            debug-build.log
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          compression-level: 6
