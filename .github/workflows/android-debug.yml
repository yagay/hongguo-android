name: Android Debug CI

on:
  push:
    branches:
      - main
      - dev
      - 'dev/**'
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    # An internal pull request already builds at each branch push; skip duplicate cold runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: Build and test Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -n "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
          else
            echo "Android 36 SDK already available"
          fi

      - name: Cache Gradle dependencies and compiled build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          # Non-default dev branches were read-only by default: cache writes now persist.
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-overwrite-existing: true

      - name: Build Debug and run static checks
        # Only Debug variants, with task outputs restored from Gradle's shared build cache.
        run: ./gradlew --no-daemon --build-cache --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload Debug test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-debug-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
